[project]
name = "arch-to-infra-engine"
version = "0.1.0"
description = "Agentic engine that turns AWS architecture diagrams into validated, policy-compliant Terraform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# Not an installable package: Lambda/AgentCore code under src/ is packaged per component.
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests
